# Builds Traffic-IP straight from GitHub — this file is all you need on the server.
#   docker compose up -d --build      (run again later to update to the latest version)
services:
  traffic-ip:
    build:
      context: https://github.com/jrl1644/Traffic-IP.git#main
    image: traffic-ip:latest
    container_name: traffic-ip
    restart: unless-stopped
    ports:
      - "8187:8187"            # change the left side to use another port, e.g. "80:8187"
    volumes:
      - traffic-ip-data:/data  # database + automatic backups
    environment:
      TZ: America/Los_Angeles
      # Optional: create the owner account on first start instead of in the browser.
      # Remove these two lines after the first start.
      # ADMIN_USERNAME: admin
      # ADMIN_PASSWORD: change-me-please
      # Sign-in cookie: "auto" marks it Secure on HTTPS visits (through your reverse proxy) and not on
      # plain-HTTP visits on your own network. "true" forces Secure (HTTPS only); "false" never.
      COOKIE_SECURE: "auto"
      # "true" when a reverse proxy sits in front, so sign-in limits and logs use each visitor's real address.
      TRUST_PROXY: "true"
      # How long a sign-in lasts, in days.
      SESSION_DAYS: "14"

volumes:
  traffic-ip-data:
