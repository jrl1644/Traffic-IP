# Builds Traffic-IP straight from GitHub — this file is all you need on the server.
#   docker compose up -d --build      (run again later to update to the latest version)
services:
  traffic-ip:
    build:
      context: https://github.com/jrl1644/Traffic-IP.git#main
    image: traffic-ip:latest
    container_name: traffic-ip
    restart: unless-stopped
    ports:
      - "8187:8187"            # browser port : server port. If you change Admin → Settings → Server port, change the right side to match.
    volumes:
      - traffic-ip-data:/data  # database + automatic backups
    environment:
      TZ: America/Los_Angeles
      # Optional: create the owner account on first start instead of in the browser.
      # Remove these two lines after the first start.
      # ADMIN_USERNAME: admin
      # ADMIN_PASSWORD: change-me-please
      # Set to "true" when the app is served over HTTPS (behind a reverse proxy).
      COOKIE_SECURE: "false"
      # How long a sign-in lasts, in days.
      SESSION_DAYS: "14"
      # Set to "true" for one start to forget a port saved in Admin → Settings → Server port.
      # RESET_PORT: "true"

volumes:
  traffic-ip-data:
